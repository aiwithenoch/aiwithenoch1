<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0f"><title>Camera Director</title><style>html,body{margin:0;background:#08090d;color:#fff;font-family:system-ui}#loading{min-height:100vh;display:grid;place-items:center}.loader{text-align:center}.dot{width:10px;height:10px;border-radius:50%;background:#5f7aff;display:inline-block;animation:p 1s infinite alternate}@keyframes p{to{transform:scale(1.8);opacity:.45}}</style></head><body><div id="loading"><div class="loader"><span class="dot"></span><p>Loading Camera Director…</p></div></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/aiwithenoch/aiwithenoch1/main/camera-director/payload';const parts=await Promise.all(Array.from({length:6},(_,i)=>fetch(`${base}/app.${i}.txt?v=030`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`Payload ${i} failed`);return r.text()})));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<p>Could not load Camera Director. Please refresh or use a modern browser.</p>';console.error(e)}})();</script></body></html>
